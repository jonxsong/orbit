<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Orbit iOS local-first architecture</title>
  <desc id="desc">An Excalidraw-style architecture diagram showing the iPhone application, its local SQLite source of truth and Keychain boundary, optional synchronization to a Go API and PostgreSQL, OIDC authentication, notifications, and an approval-gated OpenAI recommendation service.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#292724" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#292724" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 34px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #292724; }
      .subtitle { font: 500 17px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6d675f; }
      .section { font: 700 21px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #292724; }
      .label { font: 700 17px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #292724; }
      .small { font: 500 14px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6d675f; }
      .tiny { font: 600 12px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6d675f; letter-spacing: 0.08em; }
      .box { stroke: #292724; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #292724; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #7e9270; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 8 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="920" rx="28" fill="#f7f3eb" filter="url(#paper)"/>
  <text x="64" y="68" class="title">Orbit · iOS local-first architecture</text>
  <text x="64" y="99" class="subtitle">The phone is useful on its own. Cloud services are optional, bounded, and user-controlled.</text>

  <!-- iPhone boundary -->
  <g filter="url(#shadow)" transform="rotate(-0.35 356 493)">
    <rect x="54" y="142" width="604" height="700" rx="42" fill="#fffdf8" class="box"/>
    <rect x="278" y="155" width="156" height="22" rx="11" fill="#292724"/>
  </g>
  <text x="88" y="208" class="section">iPhone app</text>
  <text x="556" y="208" text-anchor="end" class="tiny">OFFLINE FIRST</text>

  <g transform="rotate(0.45 356 281)">
    <rect x="92" y="232" width="528" height="98" rx="20" fill="#f2e3d7" class="box"/>
    <text x="118" y="268" class="label">Expo Router + React Native UI</text>
    <text x="118" y="297" class="small">Today · Goals · Habits · Reflect · Profile</text>
  </g>
  <path d="M356 330 C355 344 358 351 356 364" class="flow"/>

  <g transform="rotate(-0.25 356 411)">
    <rect x="92" y="364" width="528" height="96" rx="20" fill="#e7edde" class="box"/>
    <text x="118" y="400" class="label">Application and domain state</text>
    <text x="118" y="429" class="small">Zustand commands · TanStack server cache · validation</text>
  </g>
  <path d="M356 460 C357 476 353 482 356 496" class="flow"/>

  <g transform="rotate(0.3 356 543)">
    <rect x="92" y="496" width="528" height="96" rx="20" fill="#f5ead5" class="box"/>
    <text x="118" y="532" class="label">Repositories + sync coordinator</text>
    <text x="118" y="561" class="small">Durable writes first · bounded batches · retry with jitter</text>
  </g>
  <path d="M356 592 C356 609 356 615 356 628" class="flow"/>

  <g transform="rotate(-0.35 248 682)">
    <rect x="92" y="628" width="312" height="110" rx="20" fill="#e9ddd0" class="box"/>
    <text x="118" y="666" class="label">SQLite + Drizzle</text>
    <text x="118" y="694" class="small">Source of truth</text>
    <text x="118" y="718" class="small">Records · outbox · cursor</text>
  </g>
  <g transform="rotate(0.5 520 682)">
    <rect x="432" y="628" width="188" height="110" rx="20" fill="#e2e8ed" class="box"/>
    <text x="456" y="666" class="label">Keychain</text>
    <text x="456" y="694" class="small">OIDC tokens</text>
    <text x="456" y="718" class="small">Device secret</text>
  </g>
  <g transform="rotate(0.3 356 786)">
    <rect x="148" y="766" width="416" height="54" rx="18" fill="#fffdf8" class="box" stroke-dasharray="7 7"/>
    <text x="356" y="799" text-anchor="middle" class="small">iOS Notifications · haptics · reduced motion · Dynamic Type</text>
  </g>

  <!-- Network boundary -->
  <path d="M620 544 C702 544 704 430 782 430" class="flow-soft"/>
  <text x="702" y="501" text-anchor="middle" class="tiny">OPT-IN SYNC</text>
  <path d="M782 464 C712 464 707 572 620 572" class="flow-soft"/>

  <!-- Cloud boundary -->
  <g filter="url(#shadow)" transform="rotate(0.25 1054 493)">
    <rect x="782" y="142" width="564" height="700" rx="34" fill="#fffdf8" class="box" stroke-dasharray="11 8"/>
  </g>
  <text x="816" y="208" class="section">Optional cloud services</text>
  <text x="1310" y="208" text-anchor="end" class="tiny">TLS + OWNER SCOPING</text>

  <g transform="rotate(-0.35 1064 292)">
    <rect x="824" y="242" width="480" height="100" rx="20" fill="#f2e3d7" class="box"/>
    <text x="850" y="279" class="label">Go REST API</text>
    <text x="850" y="308" class="small">Validation · rate limits · OpenTelemetry · audit events</text>
  </g>
  <path d="M1064 342 C1064 358 1064 365 1064 379" class="flow"/>

  <g transform="rotate(0.45 932 430)">
    <rect x="824" y="379" width="216" height="102" rx="20" fill="#e7edde" class="box"/>
    <text x="850" y="417" class="label">Sync service</text>
    <text x="850" y="445" class="small">Idempotency</text>
    <text x="850" y="467" class="small">Revisions + conflicts</text>
  </g>
  <g transform="rotate(-0.3 1196 430)">
    <rect x="1064" y="379" width="240" height="102" rx="20" fill="#e2e8ed" class="box"/>
    <text x="1090" y="417" class="label">OIDC provider</text>
    <text x="1090" y="445" class="small">Authorization Code</text>
    <text x="1090" y="467" class="small">+ PKCE</text>
  </g>
  <path d="M932 481 C931 506 930 515 932 537" class="flow"/>
  <path d="M1196 481 C1196 506 1165 515 1165 537" class="flow"/>

  <g transform="rotate(-0.25 1064 592)">
    <rect x="824" y="537" width="480" height="110" rx="20" fill="#e9ddd0" class="box"/>
    <text x="850" y="577" class="label">PostgreSQL</text>
    <text x="850" y="605" class="small">Normalized user data · relationship edges · tombstones</text>
    <text x="850" y="629" class="small">Monotonic change log · mutation acknowledgements</text>
  </g>

  <path d="M1064 647 C1064 669 1064 678 1064 696" class="flow"/>
  <g transform="rotate(0.35 1064 757)">
    <rect x="824" y="696" width="480" height="122" rx="20" fill="#f5ead5" class="box"/>
    <text x="850" y="735" class="label">AI recommendation adapter</text>
    <text x="850" y="763" class="small">Bounded snapshot → strict schema → pending proposal</text>
    <text x="850" y="791" class="small">OpenAI key stays server-side · user approval applies changes</text>
  </g>

  <!-- Approval loop -->
  <path d="M824 778 C753 778 721 744 721 681 C721 630 695 611 640 611" class="flow-soft"/>
  <text x="717" y="729" text-anchor="middle" class="tiny" transform="rotate(-90 717 729)">APPROVAL REQUIRED</text>

  <!-- Footer legend -->
  <circle cx="76" cy="881" r="7" fill="#e9ddd0" stroke="#292724" stroke-width="2"/>
  <text x="93" y="886" class="small">durable data</text>
  <path d="M221 880 L267 880" class="flow-soft"/>
  <text x="282" y="886" class="small">optional network path</text>
  <text x="1322" y="886" text-anchor="end" class="small">Every local mutation commits before the UI reports success.</text>
</svg>

